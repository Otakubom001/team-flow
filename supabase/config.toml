# Each handler verifies credentials itself. The publishing endpoint validates
# user sessions with Auth, then checks the publisher allowlist on every call.
[functions.buffer-publish]
verify_jwt = false

[functions.buffer-check]
verify_jwt = false

# Called by the website with its public anon key (a JWT). Writes use the
# service role inside the function; the response only reports fetch results.
[functions.ai-trends]
verify_jwt = true

# Dashboard deployed name; reuse the same audited publishing handler.
[functions.smooth-responder]
verify_jwt = false
entrypoint = "./functions/buffer-publish/index.ts"
